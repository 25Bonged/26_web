    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #0a0a0a;
            color: #ededed;
            overflow-x: hidden;
        }

        ::selection {
            background-color: #333;
            color: white;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Subdued Glows (10-15% opacity) */
        .glow-text-blue {
            text-shadow: 0 0 10px rgba(0, 112, 243, 0.15);
        }

        .glow-text-green {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
        }

        .glow-text-purple {
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
        }

        /* Subtle Borders with reveal on hover */
        .neon-border-blue {
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s ease;
        }

        .neon-border-blue:hover {
            border-color: rgba(0, 112, 243, 0.4);
        }

        .neon-border-green {
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s ease;
        }

        .neon-border-green:hover {
            border-color: rgba(16, 185, 129, 0.4);
        }

        .neon-border-purple {
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s ease;
        }

        .neon-border-purple:hover {
            border-color: rgba(139, 92, 246, 0.4);
        }

        /* Subtle Grid */
        .cyber-grid {
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        /* Glass Panels */
        .glass-cyber {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .neon-glow {
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.1));
        }

        /* Smooth transitions removed */
    </style>
    <link rel="stylesheet" href="/assets/cursor.css" />
</head>

<body class="antialiased bg-background-dark text-white cyber-grid selection:bg-white/20">

    <main class="pt-16">

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            AOS.init({
                duration: 400, // Faster animations
                once: true,
                offset: 20,
                easing: 'ease-out'
            });
        });
    </script>
    <script>setTimeout(function(){if(typeof AOS==="undefined"){document.querySelectorAll("[data-aos]").forEach(function(e){e.style.opacity=1;e.style.transform="none";});}},1200);</script>
    <script src="/assets/cursor.js" defer></script>
