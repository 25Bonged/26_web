<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#10141f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#00E5FF"/>

  <!-- Wordmark -->
  <text x="90" y="160" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    VEHICLE<tspan fill="#00E5FF">LAB</tspan>
  </text>

  <!-- Headline -->
  <text x="90" y="290" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    <tspan x="90" dy="0">Calibration &amp; diagnostics</tspan>
    <tspan x="90" dy="70">software, rebuilt</tspan>
    <tspan x="90" dy="70" fill="#00E5FF">local-first.</tspan>
  </text>

  <!-- Subtext -->
  <text x="90" y="555" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
    MDF4 analysis · AI diagnostics · ECU calibration — on-premise, private by default
  </text>

  <!-- pill -->
  <rect x="90" y="40" width="180" height="44" rx="22" fill="none" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="180" y="68" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#00E5FF" text-anchor="middle">vehiclelab.in</text>
</svg>
